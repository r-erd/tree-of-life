<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#000"/>
  <!-- Tree of life symbol: central trunk with branches -->
  <line x1="16" y1="28" x2="16" y2="10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- left branches -->
  <line x1="16" y1="22" x2="10" y2="17" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="17" x2="8"  y2="12" stroke="white" stroke-width="1"   stroke-linecap="round"/>
  <!-- right branches -->
  <line x1="16" y1="22" x2="22" y2="17" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="17" x2="24" y2="12" stroke="white" stroke-width="1"   stroke-linecap="round"/>
  <!-- nodes -->
  <circle cx="16" cy="10" r="2" fill="white"/>
  <circle cx="10" cy="17" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="22" cy="17" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="8"  cy="12" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="24" cy="12" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="16" cy="28" r="1.5" fill="white" opacity="0.6"/>
</svg>
