# Tree of Life — Passion Tree Definition
# Version must be incremented whenever nodes are added, removed, or reordered.
# Node IDs are PERMANENT — renaming 'name' is safe; changing 'id' breaks share codes.
# To add passions: open a GitHub PR editing this file.

version: 1

categories:

  # ─────────────────────────────────────────
  # BODY — Physical fitness, sport, movement
  # ─────────────────────────────────────────
  - id: body
    name: BODY
    icon: "🏋️"
    skills:

      - id: running
        name: RUNNING
        icon: "🏃"
        children:
          - id: run_5k
            name: 5K
            description: Run 5 kilometres without stopping
          - id: run_10k
            name: 10K
            description: Run 10 kilometres
            requires: run_5k
          - id: run_half
            name: HALF MARATHON
            description: Run 21.1 km
            requires: run_10k
          - id: run_marathon
            name: MARATHON
            description: Run 42.2 km — the full distance
            requires: run_half
          - id: run_ultra
            name: ULTRAMARATHON
            description: Run 50 km or more in a single event
            requires: run_marathon

      - id: swimming
        name: SWIMMING
        icon: "🏊"
        children:
          - id: swim_25m
            name: 25M
            description: Swim one pool length unassisted
          - id: swim_500m
            name: 500M
            description: Swim 500 metres continuously
            requires: swim_25m
          - id: swim_1km
            name: 1KM
            description: Swim 1 kilometre without stopping
            requires: swim_500m
          - id: swim_openwater
            name: OPEN WATER
            description: Complete an open water swim (lake, sea)
            requires: swim_500m
          - id: swim_10km
            name: 10KM MARATHON SWIM
            description: Complete a 10 km open water swim
            requires: swim_openwater

      - id: cycling
        name: CYCLING
        icon: "🚴"
        children:
          - id: cycle_30km
            name: 30KM RIDE
            description: Complete a 30 km ride
          - id: cycle_100km
            name: CENTURY (100KM)
            description: Complete a 100 km ride in a day
            requires: cycle_30km
          - id: cycle_200km
            name: 200KM AUDAX
            description: Complete a 200 km audax / sportive
            requires: cycle_100km
          - id: cycle_commuter
            name: DAILY COMMUTER
            description: Cycle to work/school for 30+ consecutive days
            requires: cycle_30km
          - id: cycle_mtb
            name: MOUNTAIN BIKING
            description: Complete an off-road trail ride
            requires: cycle_30km
            children:
              - id: mtb_enduro
                name: ENDURO TRAIL
                description: Ride a full enduro-graded trail
                requires: cycle_mtb

      - id: climbing
        name: CLIMBING
        icon: "🧗"
        children:
          - id: climb_indoor
            name: INDOOR TOP-ROPE
            description: Complete a beginner route at an indoor wall
            children:
              - id: climb_lead
                name: LEAD CLIMBING
                description: Lead climb on a rope at an indoor wall
                requires: climb_indoor
                children:
                  - id: climb_outdoor_sport
                    name: OUTDOOR SPORT CLIMB
                    description: Lead climb on natural rock outdoors
                    requires: climb_lead
                  - id: climb_multipitch
                    name: MULTI-PITCH
                    description: Complete a multi-pitch route requiring belay stations
                    requires: climb_outdoor_sport
                  - id: climb_trad
                    name: TRAD CLIMBING
                    description: Place your own gear on a traditional route
                    requires: climb_multipitch
              - id: climb_boulder
                name: BOULDERING
                description: Boulder without a rope at V0–V2 level
                requires: climb_indoor
                children:
                  - id: boulder_v4
                    name: V4
                    description: Complete a V4 boulder problem
                    requires: climb_boulder
                  - id: boulder_v6
                    name: V6
                    description: Complete a V6 boulder problem
                    requires: boulder_v4
                  - id: boulder_v8
                    name: V8
                    description: Complete a V8 boulder problem — advanced
                    requires: boulder_v6

      - id: martial_arts
        name: MARTIAL ARTS
        icon: "🥋"
        children:
          - id: ma_white_belt
            name: WHITE BELT
            description: Begin formal training in any martial art
            children:
              - id: ma_striking
                name: STRIKING
                description: Train striking arts (Boxing, Muay Thai, Karate, Kickboxing)
                requires: ma_white_belt
                children:
                  - id: ma_first_spar
                    name: FIRST SPARRING
                    description: Complete a live sparring session
                    requires: ma_striking
                  - id: ma_first_fight
                    name: FIRST COMPETITION
                    description: Enter an amateur fight or tournament
                    requires: ma_first_spar
              - id: ma_grappling
                name: GRAPPLING
                description: Train grappling arts (BJJ, Judo, Wrestling, Sambo)
                requires: ma_white_belt
                children:
                  - id: ma_blue_belt
                    name: BLUE BELT (BJJ)
                    description: Earn a blue belt or equivalent intermediate rank
                    requires: ma_grappling
                  - id: ma_purple_belt
                    name: PURPLE BELT (BJJ)
                    description: Earn a purple belt — considered advanced
