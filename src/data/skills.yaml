            name: FIRST CLASS
            description: Complete your first yoga class
          - id: yoga_30days
            name: 30-DAY STREAK
            description: Practice yoga every day for 30 days
            requires: yoga_first_class
          - id: yoga_headstand
            name: HEADSTAND
            description: Hold a headstand unsupported for 10 seconds
            requires: yoga_first_class
          - id: yoga_handstand
            name: HANDSTAND
            description: Hold a freestanding handstand for 5 seconds
            requires: yoga_headstand
          - id: yoga_splits
            name: FULL SPLITS
            description: Achieve full front or middle splits
            requires: yoga_30days

      - id: strength
        name: STRENGTH TRAINING
        icon: "💪"
        children:
          - id: str_first_gym
            name: FIRST GYM SESSION
            description: Complete your first structured strength training session
          - id: str_bodyweight
            name: BODYWEIGHT MASTERY
            description: 10 pull-ups, 20 push-ups, 20 dips — unbroken
            requires: str_first_gym
          - id: str_1pl8
            name: 1-PLATE SQUAT
            description: Squat 60 kg (1 plate each side)
            requires: str_first_gym
          - id: str_2pl8
            name: 2-PLATE SQUAT
            description: Squat 100 kg (2 plates each side)
            requires: str_1pl8
          - id: str_3pl8
            name: 3-PLATE SQUAT
            description: Squat 140 kg (3 plates each side)
            requires: str_2pl8
          - id: str_bench_1pl8
            name: 1-PLATE BENCH
            description: Bench press 60 kg
            requires: str_first_gym
          - id: str_bench_2pl8
            name: 2-PLATE BENCH
            description: Bench press 100 kg
            requires: str_bench_1pl8
          - id: str_deadlift_2pl8
            name: 2-PLATE DEADLIFT
            description: Deadlift 100 kg
            requires: str_first_gym
          - id: str_deadlift_3pl8
            name: 3-PLATE DEADLIFT
            description: Deadlift 140 kg
            requires: str_deadlift_2pl8

